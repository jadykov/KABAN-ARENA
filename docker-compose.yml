services:
  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    ports:
      - "5173:5173"
    volumes:
      - .:/workbench/new-game
      - client-node-modules:/workbench/new-game/client/node_modules
      - root-node-modules:/workbench/new-game/node_modules
    working_dir: /workbench/new-game
    command: npm run dev --workspace @kaban-arena/client

  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    ports:
      - "2567:2567"
    volumes:
      - .:/workbench/new-game
      - server-node-modules:/workbench/new-game/server/node_modules
      - root-node-modules:/workbench/new-game/node_modules
    environment:
      - PORT=2567
    working_dir: /workbench/new-game
    command: npm run dev --workspace @kaban-arena/server

  editor-api:
    image: node:20-alpine
    ports:
      - "127.0.0.1:5174:5174"
    volumes:
      - .:/workbench/new-game
    working_dir: /workbench/new-game
    command: node client/scripts/editor-api.mjs
    networks:
      - editor-local

volumes:
  client-node-modules: {}
  server-node-modules: {}
  root-node-modules: {}

networks:
  editor-local: {}
